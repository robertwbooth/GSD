name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gsd .
      - name: Smoke test
        run: |
          docker run -d --name gsd -e GSD_PASSWORD=ci -p 8080:8080 gsd
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && exit 0; sleep 1; done
          docker logs gsd; exit 1
